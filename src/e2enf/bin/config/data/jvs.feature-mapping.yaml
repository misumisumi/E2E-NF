defaults:
  - default@: jvs

# Dataset settings
train_audio:
  - data/scp/jvs005_100/train.scp  # List file of training audio files.
train_feat:
  - data/scp/jvs005_100/train.list  # List file of training feature files.
valid_audio:
  - data/scp/jvs005_100/valid.scp  # List file of validation audio files.
valid_feat:
  - data/scp/jvs005_100/valid.list  # List file of validation feature files.
eval_feat:
  # - data/scp/jvs005_100/eval.list    # List file of evaluation feature files for decoding.
  - data/scp/jvs005_100/eval_few.list    # List file of evaluation feature files for decoding.
stats:
  - data/stats/jvs005_100_no_dev.joblib   # Path to the file of statistics.
allow_cache: true  # Whether to allow cache in dataset. If true, it requires cpu memory

spkinfo: data/jvs_info.yaml # YAML format speaker information.

# Auxiliary features.
aux_feats: ["cf1", "cf2", "cf3", "cf4", "slope", "centroid", "energy"]
                                 # "uv": V/UV binary.
                                 # "f0": discrete f0.
                                 # "mcep": mel-cepstral envelope.
                                 # "cf0": continuous f0.
                                 # "mcap": mel-cepstral aperiodicity.
                                 # "bap": coded aperiodicity.
                                 # "logmsp": log mel-spectrogram.
# Feature settings
sample_rate: 24000               # Sampling rate.
hop_size: 300                    # Hop size.
dense_factors: [0.5, 1, 4, 8]    # Dense factor in PDCNNs.
sine_amp: 0.1                    # Sine amplitude.
noise_amp: 0.003                 # Noise amplitude.
signal_types: ["sine"]           # List of input signal types for generator.
sine_f0_type: "f0"              # F0 type for sine signal ("f0" or "cf0").
df_f0_type: "f0"                # F0 type for dilation factor ("f0" or "cf0").

# Collator setting
batch_max_frames: 46  # Length of each audio in batch. Make sure dividable by hop_size.

# Data loader setting
batch_size: 128     # Batch size
num_workers: 4     # Number of workers in Pytorch DataLoader
pin_memory: true   # Whether to pin memory in Pytorch DataLoader

# Other setting
remove_short_samples: true  # Whether to remove samples the length of which are less than batch_max_length
